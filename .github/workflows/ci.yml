name: CI

on:
  push:
    branches: [ main, feat/iot-agent-sim-devices  ]
  pull_request:
    branches: [ main, feat/iot-agent-sim-devices  ]

jobs:
  pipeline:
    uses: AGH-iot-agent/common-pipeline/.github/workflows/common-pipeline.yml@feat/IOTAG-01-common-pipeline
    secrets: inherit
    with:
      service_name: iot-agent-sim-devices
      project_type: maven
      java_version: "21"
      values_file: ${{ github.event_name == 'pull_request' && 'Helm/sbx.yaml' || 'Helm/dev.yaml' }}
      chart_type: deployment
      namespace: ${{ github.event_name == 'pull_request' && 'iotag-sbx' || 'iotag-dev' }}
      deploy: false
